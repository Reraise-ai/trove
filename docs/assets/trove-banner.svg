<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Trove – the cleanup desk for you and your AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17142a"/>
      <stop offset="1" stop-color="#231d45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#7c6fe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c6fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a8ff0"/>
      <stop offset="1" stop-color="#5b4fd0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(96 92)">
    <rect width="176" height="176" rx="40" fill="url(#lg)"/>
    <g transform="scale(1.375)">
      <rect x="22" y="32" width="34" height="64" rx="7" fill="#fff" fill-opacity="0.95"/>
      <rect x="29" y="44" width="20" height="4" rx="2" fill="#7c6fe0" fill-opacity="0.55"/>
      <rect x="29" y="54" width="16" height="4" rx="2" fill="#7c6fe0" fill-opacity="0.35"/>
      <rect x="29" y="64" width="20" height="4" rx="2" fill="#7c6fe0" fill-opacity="0.35"/>
      <rect x="72" y="32" width="34" height="64" rx="7" fill="#fff" fill-opacity="0.95"/>
      <rect x="79" y="44" width="20" height="4" rx="2" fill="#7c6fe0" fill-opacity="0.55"/>
      <path d="M80 70 l6 6 l12 -13" fill="none" stroke="#3fb68b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M56 64 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="3">
        <rect x="36" y="104" width="16" height="9" rx="4.5"/>
        <rect x="56" y="104" width="16" height="9" rx="4.5"/>
        <rect x="76" y="104" width="16" height="9" rx="4.5"/>
      </g>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="320" y="170" fill="#ffffff" font-size="96" font-weight="700" letter-spacing="-2">Trove</text>
    <text x="324" y="218" fill="#d9d4ff" font-size="28" font-weight="500">The cleanup desk for you and your AI agents.</text>
    <text x="324" y="254" fill="#a9a2d9" font-size="20">You see, click and approve. Agents do the work. Every step is tamper-evident.</text>

    <!-- chips -->
    <g font-size="15" font-weight="600">
      <rect x="324" y="280" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#7c6fe0" stroke-opacity="0.7"/>
      <text x="380" y="300" fill="#e7e3ff" text-anchor="middle">local-first</text>
      <rect x="448" y="280" width="170" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#7c6fe0" stroke-opacity="0.7"/>
      <text x="533" y="300" fill="#e7e3ff" text-anchor="middle">human-in-the-loop</text>
      <rect x="630" y="280" width="190" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#7c6fe0" stroke-opacity="0.7"/>
      <text x="725" y="300" fill="#e7e3ff" text-anchor="middle">tamper-evident log</text>
      <rect x="832" y="280" width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#7c6fe0" stroke-opacity="0.7"/>
      <text x="912" y="300" fill="#e7e3ff" text-anchor="middle">Hermes plugin</text>
    </g>
  </g>

  <!-- decorative hash chain, right side -->
  <g transform="translate(1056 44)">
    <g fill="none" stroke="#9a8ff0" stroke-width="2">
      <rect x="0" y="0" width="168" height="34" rx="10" stroke-opacity="0.9"/>
      <rect x="0" y="48" width="168" height="34" rx="10" stroke-opacity="0.6"/>
      <rect x="0" y="96" width="168" height="34" rx="10" stroke-opacity="0.35"/>
      <path d="M84 34 v14 M84 82 v14" stroke-opacity="0.6" stroke-dasharray="3 3"/>
    </g>
    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" fill="#cfc9ff">
      <text x="14" y="22">#41 kopiert</text>
      <text x="14" y="70" fill-opacity="0.75">#42 verifiziert</text>
      <text x="14" y="118" fill-opacity="0.5">#43 verschoben</text>
      <text x="154" y="22" text-anchor="end" fill="#3fb68b">✓</text>
      <text x="154" y="70" text-anchor="end" fill="#3fb68b" fill-opacity="0.75">✓</text>
      <text x="154" y="118" text-anchor="end" fill="#3fb68b" fill-opacity="0.5">✓</text>
    </g>
  </g>
</svg>
